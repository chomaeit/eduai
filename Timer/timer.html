<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c100f">
  <title>집중 타이머</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      color: #edf1e9;
      background: #0c100f;
      --muted: #a3b3a9;
      --accent: #bee7c9;
      --line: #34433c;
      --panel: #17201c;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      place-items: center;
      background: radial-gradient(ellipse at 50% 10%, #1d2b24, #0c100f 70%);
    }

    .setup {
      display: grid;
      justify-items: center;
      gap: clamp(14px, 3.5svh, 30px);
      width: min(100%, 440px);
      margin: 0;
      padding: 28px 18px;
      text-align: center;
    }

    .setup-header { display: grid; justify-items: center; gap: 9px; }

    .setup-header svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.4;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 5vw, 1.6rem);
      font-weight: 650;
      letter-spacing: -.04em;
    }

    .dial {
      position: relative;
      display: grid;
      aspect-ratio: 1;
      place-items: center;
      container-type: inline-size;
      isolation: isolate;
      font-variant-numeric: tabular-nums;
    }

    .dial::before {
      position: absolute;
      z-index: -1;
      inset: 9%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #18251e, #111815 75%);
      content: "";
    }

    .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; }
    .ticks { stroke: #44594e; stroke-width: 3; stroke-dasharray: .12 .88; }
    .major-ticks { stroke: #7a9485; stroke-width: 6; stroke-dasharray: .023 .977; }
    .track { stroke: #32443b; stroke-width: 2; }
    .setup-dial { width: min(76vw, 272px); }

    .duration-field {
      display: grid;
      position: absolute;
      inset: 20%;
      align-content: center;
      justify-items: center;
      gap: 8px;
      border-radius: 50%;
      cursor: text;
    }

    .duration-field input {
      width: 85%;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: inherit;
      caret-color: var(--accent);
      font: inherit;
      font-size: clamp(2.75rem, 15vw, 4.75rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.065em;
      text-align: center;
    }

    .duration-field:hover .unit,
    .duration-field:focus-within .unit { color: var(--accent); }

    .unit, .setup-note, .lock-status {
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.5;
    }

    .unit { display: flex; align-items: center; gap: 5px; }
    .unit svg { position: static; width: 12px; height: 12px; stroke: currentColor; }

    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .setup-options { display: grid; width: 100%; gap: 10px; }

    .presets {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }

    .preset, .control {
      min-height: 46px;
      padding: 6px 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      font-size: .86rem;
      font-weight: 650;
    }

    .preset:hover, .control:hover { border-color: #819e8e; }

    .preset[aria-pressed="true"] {
      border-color: #759985;
      color: var(--accent);
      background: #25392e;
    }

    .primary {
      display: inline-flex;
      min-height: 51px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--accent);
      color: #15271e;
      font-size: .95rem;
      font-weight: 750;
    }

    .primary:hover { background: #d2f0d9; }
    .primary svg { width: 13px; height: 13px; fill: currentColor; }

    .setup-note {
      min-height: 2.25em;
      margin: 3px 0 0;
    }

    .setup-note[data-error] { color: #ffc9b5; }

    .focus-view {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow: hidden;
      background: radial-gradient(circle at center, #151e19, #0a0e0c 72%);
    }

    .focus-view:fullscreen { width: 100%; height: 100%; }

    .focus-dial {
      width: min(85vw, 80vh, 760px);
      width: min(85vw, 80dvh, 760px);
    }

    .focus-dial .track { stroke-width: 3; }
    .focus-dial .ticks { opacity: .72; }
    .focus-dial .major-ticks { opacity: .76; }

    .progress {
      stroke: url(#arc-color);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 0;
    }

    .focus-view[data-state="running"] .progress { transition: stroke-dashoffset .2s linear; }
    .focus-view[data-state="paused"] .progress { opacity: .55; }
    .focus-view[data-state="done"] .progress { visibility: hidden; }
    .focus-view[data-state="done"] .track { stroke: #658b74; }

    .readout {
      display: grid;
      justify-items: center;
      gap: clamp(6px, 2cqi, 18px);
      text-align: center;
    }

    .time {
      font-size: min(15vw, 16vh, 8.5rem);
      font-size: min(21cqi, 9rem);
      font-weight: 350;
      line-height: .94;
      letter-spacing: -.07em;
    }

    .phase {
      margin: 0;
      color: var(--muted);
      font-size: clamp(.72rem, 3cqi, 1rem);
      letter-spacing: .1em;
    }

    .focus-view[data-state="done"] .phase { color: var(--accent); }

    .focus-trigger {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }

    .focus-trigger:focus-visible { outline-offset: -8px; }

    .focus-controls {
      position: absolute;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      left: max(14px, env(safe-area-inset-left));
      display: grid;
      justify-content: center;
      grid-template-columns: repeat(2, minmax(0, 144px));
      gap: 8px;
      pointer-events: none;
    }

    .focus-controls button {
      min-height: 46px;
      pointer-events: auto;
      box-shadow: 0 4px 14px #0a0e0c80;
    }

    .lock-status {
      grid-column: 1 / -1;
      justify-self: center;
      margin: 0;
      text-align: center;
    }

    .lock-status:empty { display: none; }

    @media (orientation: landscape) and (min-width: 620px) and (max-height: 460px) {
      .setup { padding-block: 16px; }
      .setup-dial { width: min(50vh, 230px); }
      .duration-field input { font-size: min(14vh, 4.75rem); }
      .focus-controls {
        top: 50%;
        right: max(16px, env(safe-area-inset-right));
        bottom: auto;
        left: auto;
        grid-template-columns: 116px;
        transform: translateY(-50%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .focus-view[data-state="running"] .progress { transition: none; }
    }
  </style>
</head>
<body>
  <main aria-label="집중 타이머">
    <form class="setup" id="setup" novalidate>
      <header class="setup-header">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <circle cx="14" cy="14" r="10.5" />
          <path d="M14 7.5V14l4 2.5M14 1v4" stroke-linecap="round" />
        </svg>
        <h1>집중 타이머</h1>
      </header>

      <div class="dial setup-dial">
        <svg viewBox="0 0 240 240" aria-hidden="true">
          <g transform="rotate(-90 120 120)">
            <circle class="ticks" cx="120" cy="120" r="112" pathLength="60" />
            <circle class="major-ticks" cx="120" cy="120" r="112" pathLength="12" />
          </g>
          <circle class="track" cx="120" cy="120" r="101" />
          <path d="M108 19.7A101 101 0 0 1 132 19.7" stroke="#bee7c9" stroke-width="2" stroke-linecap="round" />
        </svg>
        <label class="duration-field">
          <input id="duration" type="text" inputmode="numeric" enterkeyhint="go" maxlength="3"
                 value="05" autocomplete="off" aria-label="집중 시간(분)" aria-describedby="setup-note">
          <span class="unit" aria-hidden="true">
            분
            <svg viewBox="0 0 16 16" fill="none">
              <path d="m3 10 7.5-7.5 3 3L6 13H3v-3Zm6-6 3 3" stroke-width="1.3" stroke-linejoin="round" />
            </svg>
          </span>
        </label>
      </div>

      <div class="setup-options">
        <div class="presets" role="group" aria-label="빠른 시간 설정">
          <button class="preset" type="button" data-minutes="5" aria-pressed="true">5분</button>
          <button class="preset" type="button" data-minutes="10" aria-pressed="false">10분</button>
          <button class="preset" type="button" data-minutes="15" aria-pressed="false">15분</button>
          <button class="preset" type="button" data-minutes="30" aria-pressed="false">30분</button>
          <button class="preset" type="button" data-minutes="60" aria-pressed="false">60분</button>
        </div>
        <button class="primary" type="submit" id="start">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.8v10.4a.7.7 0 0 0 1.1.6l8-5.2a.7.7 0 0 0 0-1.2l-8-5.2a.7.7 0 0 0-1.1.6Z" /></svg>
          시작
        </button>
        <p class="setup-note" id="setup-note" role="status">가운데 숫자를 눌러 시간을 직접 입력하세요.</p>
      </div>
    </form>

    <section class="focus-view" id="focus-view" aria-label="집중 화면" hidden>
      <div class="dial focus-dial">
        <svg viewBox="0 0 240 240" aria-hidden="true">
          <defs>
            <linearGradient id="arc-color" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#94b9a3" />
              <stop offset="100%" stop-color="#d2f0cf" />
            </linearGradient>
          </defs>
          <g transform="rotate(-90 120 120)">
            <circle class="ticks" cx="120" cy="120" r="112" pathLength="60" />
            <circle class="major-ticks" cx="120" cy="120" r="112" pathLength="12" />
            <circle class="track" cx="120" cy="120" r="101" />
            <circle class="progress" id="progress" cx="120" cy="120" r="101" pathLength="100" />
          </g>
        </svg>
        <div class="readout">
          <div class="time" id="remaining" role="timer" aria-label="남은 시간 5분 0초">05:00</div>
          <p class="phase" id="phase" role="status">집중 중</p>
        </div>
      </div>

      <button type="button" class="focus-trigger" id="focus-trigger" aria-label="조작 버튼 보기"
              aria-controls="focus-controls" aria-expanded="false"></button>
      <div class="focus-controls" id="focus-controls" role="group" aria-label="타이머 조작" hidden>
        <button type="button" class="primary" id="toggle">일시멈춤</button>
        <button type="button" class="control" id="stop">정지</button>
        <p class="lock-status" id="screen-lock-status" role="status"></p>
      </div>
    </section>
  </main>

  <script>
    const minuteMs = 60_000;
    const maxMinutes = 120;
    const setup = document.getElementById('setup');
    const duration = document.getElementById('duration');
    const setupNote = document.getElementById('setup-note');
    const setupHint = setupNote.textContent;
    const start = document.getElementById('start');
    const presets = document.querySelectorAll('[data-minutes]');
    const focusView = document.getElementById('focus-view');
    const focusTrigger = document.getElementById('focus-trigger');
    const focusControls = document.getElementById('focus-controls');
    const progress = document.getElementById('progress');
    const remaining = document.getElementById('remaining');
    const phase = document.getElementById('phase');
    const toggle = document.getElementById('toggle');
    const stop = document.getElementById('stop');
    const screenLockStatus = document.getElementById('screen-lock-status');
    const labels = {
      running: { phase: '집중 중', action: '일시멈춤' },
      paused: { phase: '일시멈춤', action: '계속하기' },
      done: { phase: '시간 종료', action: '다시 시작' },
    };

    let minutes = 5;
    let remainingMs = minutes * minuteMs;
    let deadline = 0;
    let interval;
    let state = 'ready';
    let screenLock = null;
    let screenLockRequest = null;

    async function updateScreenLock() {
      if (state !== 'running' || document.visibilityState !== 'visible') {
        // A pending request can still resolve after pausing or leaving the page.
        screenLockRequest = null;
        const lock = screenLock;
        screenLock = null;
        if (screenLockStatus.textContent) screenLockStatus.textContent = '';
        if (lock) await lock.release();
        return;
      }

      if (!navigator.wakeLock) {
        screenLockStatus.textContent = '이 환경에서는 화면 켜짐 유지를 지원하지 않아요.';
        return;
      }
      if (screenLockRequest || (screenLock && !screenLock.released)) return;

      const request = navigator.wakeLock.request('screen');
      screenLockRequest = request;
      try {
        const lock = await request;
        if (screenLockRequest !== request || document.visibilityState !== 'visible') {
          await lock.release();
          return;
        }
        if (lock.released) {
          screenLockStatus.textContent = '화면 켜짐 유지가 해제됐어요.';
          return;
        }
        screenLock = lock;
        screenLockStatus.textContent = '화면 켜짐 유지 중';
        lock.addEventListener('release', () => {
          if (screenLock !== lock) return;
          screenLock = null;
          screenLockStatus.textContent = '화면 켜짐 유지가 해제됐어요.';
        }, { once: true });
      } catch {
        if (screenLockRequest === request) {
          screenLockStatus.textContent = '화면 켜짐 유지가 적용되지 않았어요.';
        }
      } finally {
        if (screenLockRequest === request) screenLockRequest = null;
      }
    }

    function formatNumber(value) {
      return String(value).padStart(2, '0');
    }

    function renderTime() {
      const totalSeconds = Math.ceil(remainingMs / 1000);
      const minutesLeft = Math.floor(totalSeconds / 60);
      const secondsLeft = totalSeconds % 60;
      const time = formatNumber(minutesLeft) + ':' + formatNumber(secondsLeft);
      progress.style.strokeDashoffset = 100 * (1 - remainingMs / (minutes * minuteMs));

      if (remaining.textContent !== time) {
        remaining.textContent = time;
        remaining.setAttribute('aria-label', '남은 시간 ' + minutesLeft + '분 ' + secondsLeft + '초');
      }

      let title = '집중 타이머';
      if (state === 'running') title = time + ' · 집중 타이머';
      if (state === 'paused') title = time + ' · 일시멈춤';
      if (state === 'done') title = '시간 종료 · 집중 타이머';
      if (document.title !== title) document.title = title;
    }

    function setControls(visible) {
      focusControls.hidden = !visible;
      focusTrigger.setAttribute('aria-expanded', String(visible));
      focusTrigger.setAttribute('aria-label', visible ? '조작 버튼 숨기기' : '조작 버튼 보기');
    }

    function render() {
      focusView.dataset.state = state;
      if (state !== 'ready') {
        phase.textContent = labels[state].phase;
        toggle.textContent = labels[state].action;
        stop.textContent = state === 'done' ? '시간 설정' : '정지';
      }
      renderTime();
      updateScreenLock();
    }

    function tick() {
      if (state !== 'running') return;
      remainingMs = Math.min(remainingMs, Math.max(0, deadline - Date.now()));
      if (remainingMs === 0) {
        clearInterval(interval);
        state = 'done';
        setControls(true);
        render();
      } else {
        renderTime();
      }
    }

    function readDuration() {
      const value = duration.value.trim();
      return /^[0-9]{1,3}$/.test(value) ? Number(value) : 0;
    }

    function refreshDuration() {
      const value = readDuration();
      for (const preset of presets) {
        preset.setAttribute('aria-pressed', String(Number(preset.dataset.minutes) === value));
      }
      duration.removeAttribute('aria-invalid');
      setupNote.removeAttribute('data-error');
      if (setupNote.textContent !== setupHint) setupNote.textContent = setupHint;
    }

    function leaveFullscreen() {
      if (document.fullscreenElement === focusView) {
        document.exitFullscreen().catch(() => {});
      }
    }

    function startCountdown() {
      if (state !== 'paused') remainingMs = minutes * minuteMs;
      deadline = Date.now() + remainingMs;
      state = 'running';
      interval = setInterval(tick, 200);
      setControls(false);
      focusTrigger.focus();
      render();
    }

    setup.addEventListener('submit', (event) => {
      event.preventDefault();
      if (state !== 'ready') return;
      const value = readDuration();
      if (value < 1 || value > maxMinutes) {
        duration.setAttribute('aria-invalid', 'true');
        setupNote.setAttribute('data-error', '');
        setupNote.textContent = '1분부터 120분 사이의 시간을 입력하세요.';
        duration.focus();
        return;
      }

      minutes = value;
      duration.value = formatNumber(minutes);
      refreshDuration();
      setup.hidden = true;
      focusView.hidden = false;
      if (document.fullscreenEnabled) {
        focusView.requestFullscreen({ navigationUI: 'hide' }).then(() => {
          if (state === 'ready') leaveFullscreen();
        }).catch(() => {});
      }
      startCountdown();
    });

    duration.addEventListener('focus', () => duration.select());
    duration.addEventListener('click', () => duration.select());
    duration.addEventListener('input', refreshDuration);
    for (const preset of presets) {
      preset.addEventListener('click', () => {
        duration.value = formatNumber(Number(preset.dataset.minutes));
        refreshDuration();
      });
    }

    focusTrigger.addEventListener('click', () => {
      setControls(focusControls.hidden);
    });

    toggle.addEventListener('click', () => {
      if (state === 'running') {
        tick();
        if (state !== 'running') return;
        clearInterval(interval);
        state = 'paused';
        render();
      } else if (state === 'paused' || state === 'done') {
        startCountdown();
      }
    });

    stop.addEventListener('click', () => {
      clearInterval(interval);
      state = 'ready';
      remainingMs = minutes * minuteMs;
      leaveFullscreen();
      setControls(false);
      focusView.hidden = true;
      setup.hidden = false;
      render();
      start.focus();
    });

    document.addEventListener('visibilitychange', () => {
      tick();
      updateScreenLock();
    });
  </script>
</body>
</html>
