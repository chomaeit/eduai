<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c100f">
  <title>집중 타이머</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      color: #edf1e9;
      background: #0c100f;
      --muted: #a3b3a9;
      --accent: #bee7c9;
      --line: #34433c;
      --panel: #17201c;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      place-items: center;
      background: radial-gradient(ellipse at 50% 10%, #1d2b24, #0c100f 70%);
    }

    .setup {
      display: grid;
      justify-items: center;
      gap: clamp(14px, 3.5svh, 30px);
      width: min(100%, 440px);
      margin: 0;
      padding: 28px 18px;
      text-align: center;
    }

    .setup-header { position: relative; display: grid; width: 100%; justify-items: center; gap: 9px; }

    .setup-header svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.4;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 5vw, 1.6rem);
      font-weight: 650;
      letter-spacing: -.04em;
    }

    .dial {
      position: relative;
      display: grid;
      aspect-ratio: 1;
      place-items: center;
      container-type: inline-size;
      isolation: isolate;
      font-variant-numeric: tabular-nums;
    }

    .dial::before {
      position: absolute;
      z-index: -1;
      inset: 9%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #18251e, #111815 75%);
      content: "";
    }

    .dial svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; }
    .ticks { stroke: #44594e; stroke-width: 3; stroke-dasharray: .12 .88; }
    .major-ticks { stroke: #7a9485; stroke-width: 6; stroke-dasharray: .023 .977; }
    .track { stroke: #32443b; stroke-width: 2; }
    .setup-dial { width: min(76vw, 272px); }

    .duration-field {
      display: grid;
      position: absolute;
      inset: 20%;
      align-content: center;
      justify-items: center;
      gap: 8px;
      border-radius: 50%;
      cursor: text;
    }

    .duration-field input {
      width: 85%;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: inherit;
      caret-color: var(--accent);
      font: inherit;
      font-size: clamp(2.75rem, 15vw, 4.75rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.065em;
      text-align: center;
    }

    .duration-field:hover .unit,
    .duration-field:focus-within .unit { color: var(--accent); }

    .unit, .setup-note, .lock-status {
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.5;
    }

    .unit { display: flex; align-items: center; gap: 5px; }
    .unit svg { position: static; width: 12px; height: 12px; stroke: currentColor; }

    button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .setup-options { display: grid; width: 100%; gap: 10px; }

    .presets {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }

    .preset, .control {
      min-height: 46px;
      padding: 6px 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      font-size: .86rem;
      font-weight: 650;
    }

    .preset:hover, .control:hover { border-color: #819e8e; }

    .preset[aria-pressed="true"] {
      border-color: #759985;
      color: var(--accent);
      background: #25392e;
    }

    .primary {
      display: inline-flex;
      min-height: 51px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--accent);
      color: #15271e;
      font-size: .95rem;
      font-weight: 750;
    }

    .primary:hover { background: #d2f0d9; }
    .primary svg { width: 13px; height: 13px; fill: currentColor; }

    .setup-note {
      min-height: 2.25em;
      margin: 3px 0 0;
    }

    .setup-note[data-error] { color: #ffc9b5; }

    .focus-view {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow: hidden;
      background: radial-gradient(circle at center, #151e19, #0a0e0c 72%);
    }

    .focus-dial {
      width: min(85vw, 80vh, 760px);
      width: min(85vw, 80dvh, 760px);
    }

    .focus-dial .track { stroke-width: 3; }
    .focus-dial .ticks { opacity: .72; }
    .focus-dial .major-ticks { opacity: .76; }

    .progress {
      stroke: url(#arc-color);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 0;
    }

    .focus-view[data-state="running"] .progress { transition: stroke-dashoffset .2s linear; }
    .focus-view[data-state="paused"] .progress { opacity: .55; }
    .focus-view[data-state="done"] .progress { visibility: hidden; }
    .focus-view[data-state="done"] .track { stroke: #658b74; }

    .readout {
      display: grid;
      justify-items: center;
      gap: clamp(6px, 2cqi, 18px);
      text-align: center;
    }

    .time {
      font-size: min(15vw, 16vh, 8.5rem);
      font-size: min(21cqi, 9rem);
      font-weight: 350;
      line-height: .94;
      letter-spacing: -.07em;
    }

    .phase {
      margin: 0;
      color: var(--muted);
      font-size: clamp(.72rem, 3cqi, 1rem);
      letter-spacing: .1em;
    }

    .focus-view[data-state="done"] .phase { color: var(--accent); }

    .focus-trigger {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      -webkit-tap-highlight-color: transparent;
    }

    .focus-trigger:focus-visible { outline-offset: -8px; }

    .focus-controls {
      position: absolute;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      left: max(14px, env(safe-area-inset-left));
      display: grid;
      justify-content: center;
      grid-template-columns: repeat(2, minmax(0, 144px));
      gap: 8px;
      pointer-events: none;
    }

    .focus-controls button {
      min-height: 46px;
      pointer-events: auto;
      box-shadow: 0 4px 14px #0a0e0c80;
    }

    .lock-status {
      grid-column: 1 / -1;
      justify-self: center;
      margin: 0;
      text-align: center;
    }

    .lock-status:empty { display: none; }

    .menu-button, .icon-button {
      display: grid;
      width: 44px;
      height: 44px;
      padding: 10px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
    }

    .menu-button { position: absolute; top: 0; right: 0; }
    .menu-button svg, .icon-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; }
    .menu-button:hover, .icon-button:hover { border-color: #819e8e; }
    button:disabled { opacity: .45; cursor: default; }

    .rotation-summary {
      display: grid;
      width: 100%;
      gap: 9px;
      padding: 12px 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #121b16;
      color: var(--muted);
      font-size: .74rem;
      text-align: center;
    }

    .rotation-summary:hover { border-color: #819e8e; }
    .rotation-summary strong { color: var(--accent); font-size: .78rem; font-weight: 600; }
    .summary-times { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 5px 10px; }
    .angle-label { margin: 0; color: var(--accent); font-size: clamp(.7rem, 3cqi, .95rem); }

    .slot-tabs {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
      pointer-events: auto;
    }

    .slot-tab {
      display: grid;
      gap: 5px;
      padding: 8px 3px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #131d17;
      font-size: .74rem;
    }

    .slot-tab span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
    .slot-tab[aria-pressed="true"] { border-color: #91b39e; color: var(--accent); background: #25392e; }

    .manager {
      width: min(100% - 24px, 540px);
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      padding: 0;
      border: 1px solid #4b6153;
      border-radius: 24px;
      background: #111a15;
      color: inherit;
      box-shadow: 0 24px 100px #0008;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .manager::backdrop { background: #050a07cc; }
    body:has(.manager[open]) { overflow: hidden; }

    .manager-header, .manager-footer {
      position: sticky;
      z-index: 1;
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      background: #111a15;
    }

    .manager-header { top: 0; border-bottom: 1px solid var(--line); }
    .manager-header h2 { margin: 0; font-size: 1.1rem; letter-spacing: -.03em; }
    .manager-content { display: grid; gap: 30px; padding: 24px 22px; }
    .manager-section { display: grid; gap: 13px; }
    .manager h3 { margin: 0; font-size: .93rem; }
    .manager p { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.65; }
    .manager .section-heading { display: grid; gap: 5px; }
    .preset-editor { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .preset-row { display: flex; align-items: center; gap: 3px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .preset-row label { flex: 1; display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: .78rem; }

    .manager input[type="text"] {
      width: 55px;
      min-height: 42px;
      padding: 6px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: #0d1510;
      color: #edf1e9;
      font: inherit;
      font-size: 1rem;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .manager input[aria-invalid="true"] { border-color: #e0a28b; }
    .remove-preset { width: 40px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 1.25rem; }
    .remove-preset:hover { color: #ffc9b5; background: #30251e; }
    .add-preset { background: transparent; color: var(--accent); }
    .rotation-toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-weight: 650; font-size: .93rem; cursor: pointer; }
    .rotation-toggle input { width: 22px; height: 22px; margin: 0; accent-color: #bee7c9; cursor: pointer; }
    .rotation-fields { display: grid; min-width: 0; gap: 0; padding: 0; margin: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .rotation-fields:disabled { opacity: .45; }
    .rotation-row { display: flex; min-height: 65px; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; }
    .rotation-row + .rotation-row { border-top: 1px solid var(--line); }
    .rotation-row label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: .8rem; }
    .rotation-title { display: flex; gap: 9px; align-items: center; font-size: .86rem; }
    .phone-icon { display: inline-block; width: 13px; height: 21px; margin-inline: 5px; border: 1px solid var(--accent); border-top-width: 3px; border-radius: 3px; }
    .angle-90 { transform: rotate(90deg); }
    .angle-180 { transform: rotate(180deg); }
    .angle-270 { transform: rotate(270deg); }
    .normal-value { color: var(--accent); font-size: .82rem; }
    .sensor-area { display: grid; gap: 9px; }
    .sensor-connect { justify-self: start; min-height: 40px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: var(--accent); font-size: .77rem; }
    .manager-footer { bottom: 0; display: grid; grid-template-columns: 1fr 2fr; border-top: 1px solid var(--line); }
    .manager-message { grid-column: 1 / -1; }
    .manager-message:empty { display: none; }
    .manager .manager-message[data-error] { color: #ffc9b5; }

    @media (max-width: 350px) {
      .manager-header, .manager-footer { padding-inline: 14px; }
      .manager-content { padding-inline: 14px; }
    }

    @media (orientation: landscape) and (min-width: 520px) and (max-height: 460px) {
      .setup { padding-block: 16px; }
      .setup-dial { width: min(50vh, 230px); }
      .duration-field input { font-size: min(14vh, 4.75rem); }
      .focus-controls {
        top: 50%;
        right: max(16px, env(safe-area-inset-right));
        bottom: auto;
        left: auto;
        grid-template-columns: 116px;
        transform: translateY(-50%);
      }
      .slot-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .focus-view[data-state="running"] .progress { transition: none; }
    }
  </style>
</head>
<body>
  <main aria-label="집중 타이머">
    <section class="setup" id="setup" aria-label="시간 설정">
      <header class="setup-header">
        <button type="button" class="menu-button" id="open-manager" aria-label="타이머 관리" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" /><circle cx="9" cy="6" r="2" fill="#17201c" /><circle cx="15" cy="12" r="2" fill="#17201c" /><circle cx="9" cy="18" r="2" fill="#17201c" /></svg>
        </button>
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <circle cx="14" cy="14" r="10.5" />
          <path d="M14 7.5V14l4 2.5M14 1v4" stroke-linecap="round" />
        </svg>
        <h1>집중 타이머</h1>
      </header>

      <div class="dial setup-dial">
        <svg viewBox="0 0 240 240" aria-hidden="true">
          <g transform="rotate(-90 120 120)">
            <circle class="ticks" cx="120" cy="120" r="112" pathLength="60" />
            <circle class="major-ticks" cx="120" cy="120" r="112" pathLength="12" />
          </g>
          <circle class="track" cx="120" cy="120" r="101" />
          <path d="M108 19.7A101 101 0 0 1 132 19.7" stroke="#bee7c9" stroke-width="2" stroke-linecap="round" />
        </svg>
        <label class="duration-field">
          <input id="duration" type="text" inputmode="numeric" enterkeyhint="done" maxlength="3"
                 value="05" autocomplete="off" aria-label="집중 시간(분)" aria-describedby="setup-note">
          <span class="unit" aria-hidden="true">
            분
            <svg viewBox="0 0 16 16" fill="none">
              <path d="m3 10 7.5-7.5 3 3L6 13H3v-3Zm6-6 3 3" stroke-width="1.3" stroke-linejoin="round" />
            </svg>
          </span>
        </label>
      </div>

      <div class="setup-options">
        <div class="presets" id="presets" role="group" aria-label="빠른 시간 설정">
          <button class="preset" type="button" data-minutes="5" aria-pressed="true">5분</button>
          <button class="preset" type="button" data-minutes="10" aria-pressed="false">10분</button>
          <button class="preset" type="button" data-minutes="15" aria-pressed="false">15분</button>
          <button class="preset" type="button" data-minutes="30" aria-pressed="false">30분</button>
          <button class="preset" type="button" data-minutes="60" aria-pressed="false">60분</button>
        </div>
        <button type="button" class="rotation-summary" id="rotation-summary" aria-label="회전 시간 관리" aria-haspopup="dialog">
          <strong id="rotation-summary-title">회전으로 네 개의 타이머 전환</strong>
          <span class="summary-times" id="summary-times"></span>
        </button>
        <button class="primary" type="button" id="start">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.8v10.4a.7.7 0 0 0 1.1.6l8-5.2a.7.7 0 0 0 0-1.2l-8-5.2a.7.7 0 0 0-1.1.6Z" /></svg>
          시작
        </button>
        <p class="setup-note" id="setup-note" role="status">가운데 숫자를 눌러 시간을 직접 입력하세요.</p>
      </div>
    </section>

    <section class="focus-view" id="focus-view" aria-label="집중 화면" hidden>
      <div class="dial focus-dial">
        <svg viewBox="0 0 240 240" aria-hidden="true">
          <defs>
            <linearGradient id="arc-color" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#94b9a3" />
              <stop offset="100%" stop-color="#d2f0cf" />
            </linearGradient>
          </defs>
          <g transform="rotate(-90 120 120)">
            <circle class="ticks" cx="120" cy="120" r="112" pathLength="60" />
            <circle class="major-ticks" cx="120" cy="120" r="112" pathLength="12" />
            <circle class="track" cx="120" cy="120" r="101" />
            <circle class="progress" id="progress" cx="120" cy="120" r="101" pathLength="100" />
          </g>
        </svg>
        <div class="readout">
          <p class="angle-label" id="angle-label">일반 · 0°</p>
          <div class="time" id="remaining" role="timer" aria-label="남은 시간 5분 0초">05:00</div>
          <p class="phase" id="phase" role="status">집중 중</p>
        </div>
      </div>

      <button type="button" class="focus-trigger" id="focus-trigger" aria-label="조작 버튼 보기"
              aria-controls="focus-controls" aria-expanded="false"></button>
      <div class="focus-controls" id="focus-controls" role="group" aria-label="타이머 조작" hidden>
        <button type="button" class="primary" id="toggle">일시멈춤</button>
        <button type="button" class="control" id="stop">정지</button>
        <div class="slot-tabs" id="slot-tabs" role="group" aria-label="각도별 타이머 전환"></div>
        <p class="lock-status" id="screen-lock-status" role="status"></p>
      </div>
    </section>

    <dialog class="manager" id="manager" aria-labelledby="manager-title">
      <header class="manager-header">
        <h2 id="manager-title">타이머 관리</h2>
        <button type="button" class="icon-button" id="close-manager" aria-label="관리 화면 닫기" autofocus>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke-width="1.5" stroke-linecap="round" /></svg>
        </button>
      </header>
      <div class="manager-content">
        <section class="manager-section" aria-labelledby="presets-heading">
          <div class="section-heading">
            <h3 id="presets-heading">나의 시간 버튼</h3>
            <p>자주 쓰는 시간을 1~120분으로 설정하세요. 최대 10개까지 만들 수 있어요.</p>
          </div>
          <div class="preset-editor" id="preset-editor"></div>
          <button type="button" class="control add-preset" id="add-preset">+ 시간 버튼 추가</button>
        </section>

        <section class="manager-section" aria-labelledby="rotation-heading">
          <label class="rotation-toggle" for="rotation-enabled">
            <span id="rotation-heading">회전으로 타이머 전환</span>
            <input type="checkbox" id="rotation-enabled" checked>
          </label>
          <p>시작한 방향이 0°예요. 시계 방향으로 돌리면 현재 타이머는 멈추고, 해당 각도의 타이머가 이어집니다.</p>
          <fieldset class="rotation-fields" id="rotation-fields" aria-label="회전별 시간">
            <div class="rotation-row">
              <span class="rotation-title"><span class="phone-icon" aria-hidden="true"></span>일반 · 0°</span>
              <span class="normal-value" id="normal-value">첫 화면에서 설정</span>
            </div>
            <div class="rotation-row">
              <span class="rotation-title"><span class="phone-icon angle-90" aria-hidden="true"></span>90°</span>
              <label><input type="text" id="rotation-90" inputmode="numeric" enterkeyhint="done" maxlength="3" aria-label="90도 타이머 시간">분</label>
            </div>
            <div class="rotation-row">
              <span class="rotation-title"><span class="phone-icon angle-180" aria-hidden="true"></span>180°</span>
              <label><input type="text" id="rotation-180" inputmode="numeric" enterkeyhint="done" maxlength="3" aria-label="180도 타이머 시간">분</label>
            </div>
            <div class="rotation-row">
              <span class="rotation-title"><span class="phone-icon angle-270" aria-hidden="true"></span>270°</span>
              <label><input type="text" id="rotation-270" inputmode="numeric" enterkeyhint="done" maxlength="3" aria-label="270도 타이머 시간">분</label>
            </div>
          </fieldset>
          <p>기억하는 타이머는 네 개뿐이에요. 돌아오면 남은 시간부터 계속하고, 끝난 타이머는 직접 다시 시작할 수 있어요. 정지를 누르면 네 개 모두 초기화됩니다.</p>
          <div class="sensor-area">
            <p id="sensor-status" role="status"></p>
            <button type="button" class="sensor-connect" id="sensor-connect">회전 감지 연결</button>
          </div>
        </section>
      </div>
      <footer class="manager-footer">
        <p class="manager-message" id="manager-message" role="status"></p>
        <button type="button" class="control" id="cancel-manager">취소</button>
        <button type="button" class="primary" id="save-manager">설정 저장</button>
      </footer>
    </dialog>
  </main>

  <script>
    const minuteMs = 60_000;
    const maxMinutes = 120;
    const storageKey = 'focus-timer.settings.v1';
    const defaults = {
      version: 1,
      normalMinutes: 5,
      presets: [5, 10, 15, 30, 60],
      rotationEnabled: true,
      rotations: [10, 15, 30],
    };
    const setup = document.getElementById('setup');
    const duration = document.getElementById('duration');
    const setupNote = document.getElementById('setup-note');
    const setupHint = setupNote.textContent;
    const start = document.getElementById('start');
    const presets = document.getElementById('presets');
    const summary = document.getElementById('rotation-summary');
    const summaryTitle = document.getElementById('rotation-summary-title');
    const summaryTimes = document.getElementById('summary-times');
    const focusView = document.getElementById('focus-view');
    const focusTrigger = document.getElementById('focus-trigger');
    const focusControls = document.getElementById('focus-controls');
    const progress = document.getElementById('progress');
    const remaining = document.getElementById('remaining');
    const phase = document.getElementById('phase');
    const angleLabel = document.getElementById('angle-label');
    const toggle = document.getElementById('toggle');
    const stop = document.getElementById('stop');
    const slotTabs = document.getElementById('slot-tabs');
    const screenLockStatus = document.getElementById('screen-lock-status');
    const manager = document.getElementById('manager');
    const presetEditor = document.getElementById('preset-editor');
    const addPreset = document.getElementById('add-preset');
    const rotationEnabled = document.getElementById('rotation-enabled');
    const rotationFields = document.getElementById('rotation-fields');
    const rotationInputs = [90, 180, 270].map((angle) => document.getElementById('rotation-' + angle));
    const normalValue = document.getElementById('normal-value');
    const managerMessage = document.getElementById('manager-message');
    const sensorStatus = document.getElementById('sensor-status');
    const sensorConnect = document.getElementById('sensor-connect');
    const labels = {
      ready: { phase: '대기', action: '시작' },
      running: { phase: '집중 중', action: '일시멈춤' },
      paused: { phase: '일시멈춤', action: '계속하기' },
      done: { phase: '시간 종료', action: '다시 시작' },
    };

    let settings = loadSettings();
    let timers = [];
    let activeIndex = 0;
    let sessionActive = false;
    let deadline = 0;
    let interval;
    let screenLock = null;
    let screenLockRequest = null;
    let screenBaseline = null;
    let sensorBaseline = null;
    let lastSensorQuarter = null;
    let lastSensorAt = -Infinity;
    let sensorUsable = false;
    let detectedIndex = 0;
    let pendingIndex = null;
    let rotationTimeout;
    let sensorPermission = 'unknown';
    const slotButtons = [];
    const slotReadouts = [];

    function setText(element, text) {
      if (element.textContent !== text) element.textContent = text;
    }

    function validMinutes(value) {
      return Number.isInteger(value) && value >= 1 && value <= maxMinutes;
    }

    function readMinutes(value) {
      const text = value.trim();
      const minutes = /^[0-9]{1,3}$/.test(text) ? Number(text) : 0;
      return validMinutes(minutes) ? minutes : 0;
    }

    function loadSettings() {
      const fallback = { ...defaults, presets: [...defaults.presets], rotations: [...defaults.rotations] };
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (!saved || saved.version !== 1) return fallback;
        if (!Array.isArray(saved.presets) || saved.presets.length < 1 || saved.presets.length > 10 ||
            !saved.presets.every(validMinutes) || new Set(saved.presets).size !== saved.presets.length) return fallback;
        if (!Array.isArray(saved.rotations) || saved.rotations.length !== 3 ||
            !saved.rotations.every(validMinutes)) return fallback;
        return {
          version: 1,
          normalMinutes: validMinutes(saved.normalMinutes) ? saved.normalMinutes : defaults.normalMinutes,
          presets: saved.presets,
          rotations: saved.rotations,
          rotationEnabled: typeof saved.rotationEnabled === 'boolean' ? saved.rotationEnabled : true,
        };
      } catch {
        return fallback;
      }
    }

    function persistSettings() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(settings));
        return true;
      } catch {
        return false;
      }
    }

    function formatNumber(value) {
      return String(value).padStart(2, '0');
    }

    function formatTime(milliseconds) {
      const seconds = Math.ceil(milliseconds / 1000);
      return formatNumber(Math.floor(seconds / 60)) + ':' + formatNumber(seconds % 60);
    }

    function renderPresets() {
      const buttons = settings.presets.map((minutes) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'preset';
        button.dataset.minutes = String(minutes);
        button.textContent = minutes + '분';
        button.addEventListener('click', () => {
          duration.value = formatNumber(minutes);
          refreshDuration();
        });
        return button;
      });
      presets.replaceChildren(...buttons);
    }

    function renderSummary() {
      setText(summaryTitle, settings.rotationEnabled ? '회전으로 네 개의 타이머 전환' : '회전 전환 꺼짐 · 눌러서 관리');
      summaryTimes.hidden = !settings.rotationEnabled;
      const minutes = [readMinutes(duration.value) || settings.normalMinutes, ...settings.rotations];
      const items = minutes.map((value, index) => {
        const item = document.createElement('span');
        item.textContent = index * 90 + '° ' + value + '분';
        return item;
      });
      summaryTimes.replaceChildren(...items);
    }

    function refreshDuration() {
      const minutes = readMinutes(duration.value);
      for (const preset of presets.children) {
        preset.setAttribute('aria-pressed', String(Number(preset.dataset.minutes) === minutes));
      }
      duration.removeAttribute('aria-invalid');
      setupNote.removeAttribute('data-error');
      setText(setupNote, setupHint);
      renderSummary();
    }

    function setControls(visible) {
      focusControls.hidden = !visible;
      focusTrigger.setAttribute('aria-expanded', String(visible));
      focusTrigger.setAttribute('aria-label', visible ? '조작 버튼 숨기기' : '조작 버튼 보기');
    }

    function renderTime() {
      if (!sessionActive) {
        document.title = '집중 타이머';
        return;
      }
      const timer = timers[activeIndex];
      const time = formatTime(timer.remainingMs);
      const totalSeconds = Math.ceil(timer.remainingMs / 1000);
      progress.style.strokeDashoffset = 100 * (1 - timer.remainingMs / timer.totalMs);
      if (remaining.textContent !== time) {
        remaining.textContent = time;
        remaining.setAttribute('aria-label', '남은 시간 ' + Math.floor(totalSeconds / 60) + '분 ' + totalSeconds % 60 + '초');
      }
      const title = timer.state === 'done' ? '시간 종료 · 집중 타이머' : time + ' · ' + labels[timer.state].phase;
      if (document.title !== title) document.title = title;

      for (let index = 0; index < timers.length; index++) {
        const stored = timers[index];
        setText(slotReadouts[index], formatTime(stored.remainingMs));
        slotButtons[index].setAttribute('aria-pressed', String(index === activeIndex));
        slotButtons[index].setAttribute('aria-label',
          index * 90 + '도 타이머, ' + formatTime(stored.remainingMs) + ', ' + labels[stored.state].phase);
      }
    }

    function render() {
      if (sessionActive) {
        const timer = timers[activeIndex];
        focusView.dataset.state = timer.state;
        setText(phase, labels[timer.state].phase);
        setText(toggle, labels[timer.state].action);
        setText(stop, timer.state === 'done' ? '시간 설정' : '정지');
        setText(angleLabel, activeIndex === 0 ? '일반 · 0°' : activeIndex * 90 + '°');
        slotTabs.hidden = !settings.rotationEnabled;
      }
      renderTime();
      updateScreenLock();
    }

    function syncTimer() {
      const timer = timers[activeIndex];
      if (!sessionActive || timer.state !== 'running') return;
      timer.remainingMs = Math.min(timer.remainingMs, Math.max(0, deadline - Date.now()));
      if (timer.remainingMs === 0) {
        timer.state = 'done';
        clearInterval(interval);
      }
    }

    function tick() {
      if (!sessionActive || timers[activeIndex].state !== 'running') return;
      syncTimer();
      if (timers[activeIndex].state === 'done') {
        setControls(true);
        render();
      } else {
        renderTime();
      }
    }

    function startActiveTimer() {
      clearInterval(interval);
      const timer = timers[activeIndex];
      deadline = Date.now() + timer.remainingMs;
      timer.state = 'running';
      interval = setInterval(tick, 200);
      setControls(false);
      focusTrigger.focus();
      render();
    }

    function switchTimer(index) {
      if (!sessionActive || !settings.rotationEnabled || index === activeIndex) return;
      syncTimer();
      clearInterval(interval);
      if (timers[activeIndex].state === 'running') timers[activeIndex].state = 'paused';
      activeIndex = index;
      if (timers[index].state === 'done') {
        setControls(true);
        render();
      } else {
        startActiveTimer();
      }
    }

    function startSession() {
      if (sessionActive) return;
      const minutes = readMinutes(duration.value);
      if (!minutes) {
        duration.setAttribute('aria-invalid', 'true');
        setupNote.setAttribute('data-error', '');
        setText(setupNote, '1분부터 120분 사이의 시간을 입력하세요.');
        duration.focus();
        return;
      }

      settings.normalMinutes = minutes;
      persistSettings();
      duration.value = formatNumber(minutes);
      refreshDuration();
      // These four objects are reused throughout the session. Rotation never creates a timer.
      timers = [minutes, ...settings.rotations].map((value) => ({
        totalMs: value * minuteMs,
        remainingMs: value * minuteMs,
        state: 'ready',
      }));
      activeIndex = 0;
      detectedIndex = 0;
      cancelPendingRotation();
      screenBaseline = readScreenQuarter();
      sensorBaseline = sensorUsable && Date.now() - lastSensorAt < 2000 ? lastSensorQuarter : null;
      sessionActive = true;
      setup.hidden = true;
      focusView.hidden = false;
      startActiveTimer();
      if (settings.rotationEnabled) connectSensors();
    }

    async function updateScreenLock() {
      if (!sessionActive || timers[activeIndex].state !== 'running' || document.visibilityState !== 'visible') {
        screenLockRequest = null;
        const lock = screenLock;
        screenLock = null;
        setText(screenLockStatus, '');
        if (lock) await lock.release();
        return;
      }
      if (!navigator.wakeLock) {
        setText(screenLockStatus, '이 환경에서는 화면 켜짐 유지를 지원하지 않아요.');
        return;
      }
      if (screenLockRequest || (screenLock && !screenLock.released)) return;

      const request = navigator.wakeLock.request('screen');
      screenLockRequest = request;
      try {
        const lock = await request;
        if (screenLockRequest !== request || document.visibilityState !== 'visible') {
          await lock.release();
          return;
        }
        if (lock.released) {
          setText(screenLockStatus, '화면 켜짐 유지가 해제됐어요.');
          return;
        }
        screenLock = lock;
        setText(screenLockStatus, '화면 켜짐 유지 중');
        lock.addEventListener('release', () => {
          if (screenLock !== lock) return;
          screenLock = null;
          setText(screenLockStatus, '화면 켜짐 유지가 해제됐어요.');
        }, { once: true });
      } catch {
        if (screenLockRequest === request) setText(screenLockStatus, '화면 켜짐 유지가 적용되지 않았어요.');
      } finally {
        if (screenLockRequest === request) screenLockRequest = null;
      }
    }

    function presetDraft() {
      return Array.from(presetEditor.querySelectorAll('input'), (input) => input.value);
    }

    function renderPresetEditor(values) {
      const rows = values.map((value, index) => {
        const row = document.createElement('div');
        row.className = 'preset-row';
        const label = document.createElement('label');
        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'numeric';
        input.enterKeyHint = 'done';
        input.maxLength = 3;
        input.value = String(value);
        input.setAttribute('aria-label', '시간 버튼 ' + (index + 1) + '의 분');
        label.append(input, document.createTextNode('분'));
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove-preset';
        remove.textContent = '×';
        remove.disabled = values.length === 1;
        remove.setAttribute('aria-label', '시간 버튼 ' + (index + 1) + ' 삭제');
        remove.addEventListener('click', () => {
          renderPresetEditor(presetDraft().filter((_, current) => current !== index));
          addPreset.focus();
        });
        row.append(label, remove);
        return row;
      });
      presetEditor.replaceChildren(...rows);
      addPreset.disabled = values.length >= 10;
    }

    function updateRotationFields() {
      rotationFields.disabled = !rotationEnabled.checked;
      sensorConnect.disabled = !rotationEnabled.checked || sensorPermission === 'requesting';
      updateSensorStatus();
    }

    function openManager() {
      renderPresetEditor(settings.presets);
      rotationEnabled.checked = settings.rotationEnabled;
      rotationInputs.forEach((input, index) => {
        input.value = String(settings.rotations[index]);
        input.removeAttribute('aria-invalid');
      });
      const minutes = readMinutes(duration.value) || settings.normalMinutes;
      setText(normalValue, minutes + '분 · 첫 화면에서 설정');
      managerMessage.textContent = '';
      managerMessage.removeAttribute('data-error');
      updateRotationFields();
      manager.showModal();
    }

    function managerError(input, message) {
      managerMessage.setAttribute('data-error', '');
      setText(managerMessage, message);
      input.setAttribute('aria-invalid', 'true');
      input.focus();
      input.select();
    }

    function saveManager() {
      const presetInputs = Array.from(presetEditor.querySelectorAll('input'));
      const newPresets = presetInputs.map((input) => readMinutes(input.value));
      const invalidPreset = newPresets.indexOf(0);
      if (invalidPreset !== -1) {
        managerError(presetInputs[invalidPreset], '시간 버튼은 1분부터 120분 사이로 입력하세요.');
        return;
      }
      const duplicate = newPresets.findIndex((value, index) => newPresets.indexOf(value) !== index);
      if (duplicate !== -1) {
        managerError(presetInputs[duplicate], '같은 시간의 버튼이 있어요. 다른 시간을 입력하세요.');
        return;
      }
      let rotations = settings.rotations;
      if (rotationEnabled.checked) {
        rotations = rotationInputs.map((input) => readMinutes(input.value));
        const invalidRotation = rotations.indexOf(0);
        if (invalidRotation !== -1) {
          managerError(rotationInputs[invalidRotation], '각도별 시간은 1분부터 120분 사이로 입력하세요.');
          return;
        }
      }
      settings = {
        version: 1,
        presets: newPresets,
        normalMinutes: readMinutes(duration.value) || settings.normalMinutes,
        rotationEnabled: rotationEnabled.checked,
        rotations,
      };
      const saved = persistSettings();
      renderPresets();
      refreshDuration();
      setText(setupNote, saved ? '설정을 저장했어요.' : '설정을 적용했어요. 이 환경에서는 다시 열면 설정이 초기화될 수 있어요.');
      manager.close();
    }

    function normalizeQuarter(quarter) {
      return ((Math.round(quarter) % 4) + 4) % 4;
    }

    function readScreenQuarter() {
      let angle = window.screen?.orientation?.angle;
      if (!Number.isFinite(angle)) angle = window.orientation;
      // Screen Orientation angles run counter-clockwise. Our angle labels run clockwise.
      return Number.isFinite(angle) ? normalizeQuarter(-angle / 90) : null;
    }

    function cancelPendingRotation() {
      clearTimeout(rotationTimeout);
      pendingIndex = null;
    }

    function queueRotation(index) {
      if (!sessionActive || !settings.rotationEnabled || document.visibilityState !== 'visible') return;
      if (index === detectedIndex) {
        cancelPendingRotation();
        return;
      }
      if (pendingIndex === index) return;
      cancelPendingRotation();
      pendingIndex = index;
      // Wait for a settled position so passing through an angle does not start its timer.
      rotationTimeout = setTimeout(() => {
        pendingIndex = null;
        if (!sessionActive || document.visibilityState !== 'visible') return;
        detectedIndex = index;
        switchTimer(index);
      }, 300);
    }

    function onScreenChange() {
      if (!sessionActive || !settings.rotationEnabled) return;
      if (sensorUsable && Date.now() - lastSensorAt < 1500) return;
      const quarter = readScreenQuarter();
      if (quarter !== null && screenBaseline !== null) {
        queueRotation(normalizeQuarter(quarter - screenBaseline));
      }
    }

    function onDeviceOrientation(event) {
      if (document.visibilityState !== 'visible' || (!settings.rotationEnabled && !manager.open)) return;
      if (!Number.isFinite(event.beta) || !Number.isFinite(event.gamma)) return;
      const beta = event.beta * Math.PI / 180;
      const gamma = event.gamma * Math.PI / 180;
      // Project the vertical axis into the device plane using the W3C Z-X-Y rotation matrix.
      const x = Math.cos(beta) * Math.sin(gamma);
      const y = Math.sin(beta);
      sensorUsable = Math.hypot(x, y) >= .55;
      if (!sensorUsable) {
        onScreenChange();
        if (manager.open) updateSensorStatus();
        return;
      }
      const angle = Math.atan2(x, y) * 180 / Math.PI;
      const quarter = normalizeQuarter(angle / 90);
      const distance = Math.abs(((angle - quarter * 90 + 540) % 360) - 180);
      if (distance > 25) {
        cancelPendingRotation();
        return;
      }
      lastSensorQuarter = quarter;
      lastSensorAt = Date.now();
      if (manager.open) updateSensorStatus();
      if (!sessionActive || !settings.rotationEnabled) return;
      if (sensorBaseline === null) {
        const screenQuarter = readScreenQuarter();
        const screenDelta = screenQuarter !== null && screenBaseline !== null ?
          normalizeQuarter(screenQuarter - screenBaseline) : 0;
        sensorBaseline = normalizeQuarter(quarter - screenDelta);
      }
      queueRotation(normalizeQuarter(quarter - sensorBaseline));
    }

    function updateSensorStatus() {
      let message = '휴대폰을 세워 돌려보세요. 감지가 안 되면 집중 화면의 각도 버튼으로 전환할 수 있어요.';
      if (!rotationEnabled.checked) {
        message = '회전 전환을 켜면 각도별 타이머를 사용할 수 있어요.';
      } else if (sensorPermission === 'requesting') {
        message = '회전 센서 권한을 확인하고 있어요.';
      } else if (sensorPermission === 'denied') {
        message = '센서 권한이 꺼져 있어요. 화면 방향 또는 집중 화면의 각도 버튼으로 전환할 수 있어요.';
      } else if (!window.isSecureContext) {
        message = '센서 감지는 HTTPS에서 지원돼요. 집중 화면의 각도 버튼으로도 전환할 수 있어요.';
      } else if (sensorUsable && Date.now() - lastSensorAt < 2000) {
        message = '회전 감지 중 · 시작할 때의 방향을 0°로 기억합니다.';
      }
      setText(sensorStatus, message);
    }

    async function connectSensors(retry = false) {
      const api = window.DeviceOrientationEvent;
      if (sensorPermission === 'requesting') return;
      if (typeof api?.requestPermission !== 'function') {
        updateSensorStatus();
        return;
      }
      if (!retry && sensorPermission !== 'unknown') return;
      sensorPermission = 'requesting';
      updateRotationFields();
      try {
        sensorPermission = await api.requestPermission();
      } catch {
        sensorPermission = 'denied';
      }
      updateRotationFields();
    }

    for (let index = 0; index < 4; index++) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'slot-tab';
      const label = document.createElement('span');
      label.textContent = index === 0 ? '일반 0°' : index * 90 + '°';
      const readout = document.createElement('span');
      button.append(label, readout);
      button.addEventListener('click', () => {
        if (pendingIndex !== null) detectedIndex = pendingIndex;
        cancelPendingRotation();
        switchTimer(index);
      });
      slotButtons.push(button);
      slotReadouts.push(readout);
      slotTabs.append(button);
    }

    start.addEventListener('click', startSession);
    duration.addEventListener('focus', () => duration.select());
    duration.addEventListener('click', () => duration.select());
    duration.addEventListener('input', refreshDuration);
    duration.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        duration.blur();
      }
    });

    focusTrigger.addEventListener('click', () => setControls(focusControls.hidden));
    toggle.addEventListener('click', () => {
      if (!sessionActive) return;
      const timer = timers[activeIndex];
      if (timer.state === 'running') {
        syncTimer();
        if (timer.state === 'done') {
          setControls(true);
          render();
          return;
        }
        clearInterval(interval);
        timer.state = 'paused';
        render();
      } else {
        if (timer.state === 'done') timer.remainingMs = timer.totalMs;
        startActiveTimer();
      }
    });

    stop.addEventListener('click', () => {
      clearInterval(interval);
      cancelPendingRotation();
      sessionActive = false;
      timers = [];
      activeIndex = 0;
      focusView.hidden = true;
      setup.hidden = false;
      setControls(false);
      render();
      start.focus();
    });

    document.getElementById('open-manager').addEventListener('click', openManager);
    summary.addEventListener('click', openManager);
    document.getElementById('close-manager').addEventListener('click', () => manager.close());
    document.getElementById('cancel-manager').addEventListener('click', () => manager.close());
    document.getElementById('save-manager').addEventListener('click', saveManager);
    addPreset.addEventListener('click', () => {
      const values = presetDraft();
      if (values.length >= 10) return;
      renderPresetEditor([...values, '']);
      const inputs = presetEditor.querySelectorAll('input');
      inputs[inputs.length - 1].focus();
    });
    rotationEnabled.addEventListener('change', updateRotationFields);
    sensorConnect.addEventListener('click', () => connectSensors(true));
    manager.addEventListener('input', (event) => {
      event.target.removeAttribute('aria-invalid');
      managerMessage.textContent = '';
      managerMessage.removeAttribute('data-error');
    });
    manager.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && event.target.tagName === 'INPUT') {
        event.preventDefault();
        event.target.blur();
      }
    });

    window.addEventListener('deviceorientation', onDeviceOrientation);
    window.addEventListener('orientationchange', onScreenChange);
    window.screen?.orientation?.addEventListener('change', onScreenChange);
    document.addEventListener('visibilitychange', () => {
      tick();
      updateScreenLock();
      if (document.visibilityState === 'hidden') cancelPendingRotation();
      else onScreenChange();
    });

    duration.value = formatNumber(settings.normalMinutes);
    renderPresets();
    refreshDuration();
  </script>
</body>
</html>
